# Development overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# All published ports bind to 127.0.0.1 only.
services:
  db:
    # A container attached only to an `internal: true` network cannot publish
    # ports, so dev also attaches the DB to `edge`. Host binding stays 127.0.0.1.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  backend:
    build:
      target: dev
    environment:
      APP_ENV: development
      LOG_FORMAT: text
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    read_only: false

  frontend:
    build:
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
    read_only: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 10
